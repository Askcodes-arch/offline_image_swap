name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Verify project files
        shell: cmd
        run: |
          if not exist main.py exit /b 1
          if not exist swap.py exit /b 1
          if not exist models\haarcascade_frontalface_default.xml exit /b 1

      - name: Build application
        run: |
          pyinstaller ^
            --noconfirm ^
            --clean ^
            --windowed ^
            --onedir ^
            --name OfflineImageSwap ^
            --add-data "models;models" ^
            main.py

      - name: Create application directories
        shell: cmd
        run: |
          if not exist dist\OfflineImageSwap\input mkdir dist\OfflineImageSwap\input
          if not exist dist\OfflineImageSwap\output mkdir dist\OfflineImageSwap\output

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: OfflineImageSwap-Windows
          path: dist/OfflineImageSwap/
          if-no-files-found: error
