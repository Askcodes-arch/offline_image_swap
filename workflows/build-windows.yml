name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Verify project files
        shell: cmd
        run: |
          if not exist main.py (
            echo ERROR: main.py not found
            exit /b 1
          )

          if not exist swap.py (
            echo ERROR: swap.py not found
            exit /b 1
          )

          if not exist requirements.txt (
            echo ERROR: requirements.txt not found
            exit /b 1
          )

          if not exist models\haarcascade_frontalface_default.xml (
            echo ERROR: Haar Cascade not found
            exit /b 1
          )

      - name: Build EXE
        run: |
          python -m PyInstaller ^
            --noconfirm ^
            --clean ^
            --windowed ^
            --onedir ^
            --name OfflineImageSwap ^
            --add-data "models;models" ^
            main.py

      - name: Create runtime folders
        shell: cmd
        run: |
          if not exist "dist\OfflineImageSwap\input" (
            mkdir "dist\OfflineImageSwap\input"
          )

          if not exist "dist\OfflineImageSwap\output" (
            mkdir "dist\OfflineImageSwap\output"
          )

      - name: Verify EXE
        shell: cmd
        run: |
          if not exist "dist\OfflineImageSwap\OfflineImageSwap.exe" (
            echo ERROR: EXE was not created
            exit /b 1
          )

          if not exist "dist\OfflineImageSwap\models\haarcascade_frontalface_default.xml" (
            echo ERROR: Haar Cascade was not packaged
            exit /b 1
          )

      - name: Package application
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist\OfflineImageSwap\*" `
            -DestinationPath "dist\OfflineImageSwap-Windows.zip" `
            -Force

      - name: Upload EXE package
        uses: actions/upload-artifact@v4
        with:
          name: OfflineImageSwap-Windows
          path: dist/OfflineImageSwap-Windows.zip
          if-no-files-found: error
