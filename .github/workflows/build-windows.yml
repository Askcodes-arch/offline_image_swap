name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: "x64"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install numpy==1.24.4
          python -m pip install opencv-python==4.8.1.78
          python -m pip install Pillow==10.4.0
          python -m pip install pyinstaller==5.13.2

      - name: Check project files
        shell: powershell
        run: |
          if (!(Test-Path "main.py")) {
              Write-Error "main.py is missing."
              exit 1
          }

          if (!(Test-Path "swap.py")) {
              Write-Error "swap.py is missing."
              exit 1
          }

          if (!(Test-Path "models\haarcascade_frontalface_default.xml")) {
              Write-Error "Haar Cascade is missing."
              exit 1
          }

      - name: Build EXE
        shell: powershell
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name OfflineImageSwap `
            --add-data "models;models" `
            main.py

      - name: Verify EXE
        shell: powershell
        run: |
          if (!(Test-Path "dist\OfflineImageSwap\OfflineImageSwap.exe")) {
              Write-Error "EXE was not created."
              exit 1
          }

          if (!(Test-Path "dist\OfflineImageSwap\models\haarcascade_frontalface_default.xml")) {
              Write-Error "Haar Cascade was not packaged."
              exit 1
          }

      - name: Create runtime folders
        shell: powershell
        run: |
          New-Item -ItemType Directory `
            -Force `
            -Path "dist\OfflineImageSwap\input" | Out-Null

          New-Item -ItemType Directory `
            -Force `
            -Path "dist\OfflineImageSwap\output" | Out-Null

      - name: Create ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist\OfflineImageSwap\*" `
            -DestinationPath "OfflineImageSwap-Windows.zip" `
            -CompressionLevel Optimal `
            -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: OfflineImageSwap-Windows
          path: OfflineImageSwap-Windows.zip
          if-no-files-found: error
