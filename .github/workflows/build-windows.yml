name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-2019

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
          architecture: "x64"

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade "pip<25"

      - name: Install dependencies
        run: |
          python -m pip install numpy==1.24.4
          python -m pip install opencv-python==4.8.1.78
          python -m pip install Pillow==10.4.0
          python -m pip install pyinstaller==5.13.2

      - name: Check project files
        shell: powershell
        run: |
          Write-Host "=== Project files ==="
          Get-ChildItem -Recurse -File | Select-Object FullName

          Write-Host "=== Main Python file ==="
          Get-Item main.py

          Write-Host "=== Haar Cascade ==="
          if (Test-Path "models\haarcascade_frontalface_default.xml") {
            Write-Host "Haar Cascade found."
          } else {
            Write-Error "Haar Cascade file is missing!"
          }

      - name: Build EXE
        run: |
          python -m PyInstaller `
            --onefile `
            --windowed `
            --name OfflineImageSwap `
            main.py

      - name: Verify EXE
        shell: powershell
        run: |
          if (!(Test-Path "dist\OfflineImageSwap.exe")) {
            Write-Error "EXE was not created!"
            exit 1
          }

          Write-Host "EXE successfully created:"
          Get-Item "dist\OfflineImageSwap.exe"

      - name: Create release package
        shell: powershell
        run: |
          if (Test-Path "package") {
            Remove-Item "package" -Recurse -Force
          }

          New-Item -ItemType Directory -Force -Path "package" | Out-Null

          Copy-Item `
            "dist\OfflineImageSwap.exe" `
            "package\OfflineImageSwap.exe"

          if (Test-Path "models") {
            Copy-Item `
              "models" `
              "package\models" `
              -Recurse `
              -Force
          }

          if (Test-Path "README.md") {
            Copy-Item `
              "README.md" `
              "package\README.md"
          }

          Compress-Archive `
            -Path "package\*" `
            -DestinationPath "OfflineImageSwap-Windows.zip" `
            -Force

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: OfflineImageSwap-Windows
          path: OfflineImageSwap-Windows.zip
