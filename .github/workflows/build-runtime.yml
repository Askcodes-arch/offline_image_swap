name: Build Runtime Package

on:
  workflow_dispatch:

jobs:
  build-runtime:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
  uses: actions/setup-python@v5
  with:
    python-version: "3.10.11"
    architecture: "x64"
    cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install numpy==1.24.4
          python -m pip install opencv-python==4.8.1.78
          python -m pip install Pillow==10.4.0

      - name: Create runtime
        shell: powershell
        run: |
          if (Test-Path "runtime") {
              Remove-Item "runtime" -Recurse -Force
          }

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "runtime" | Out-Null

          $python = (Get-Command python).Source

          Copy-Item `
            $python `
            "runtime\python.exe"

          $pythonDir = Split-Path `
            $python `
            -Parent

          Copy-Item `
            "$pythonDir\python38.dll" `
            "runtime\python38.dll"

          Copy-Item `
            "$pythonDir\DLLs" `
            "runtime\DLLs" `
            -Recurse

          Copy-Item `
            "$pythonDir\Lib" `
            "runtime\Lib" `
            -Recurse

          Copy-Item `
            "$pythonDir\Scripts" `
            "runtime\Scripts" `
            -Recurse `
            -ErrorAction SilentlyContinue

          $sitePackages = python -c `
            "import site; print(site.getsitepackages()[0])"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "runtime\Lib\site-packages" | Out-Null

          Copy-Item `
            "$sitePackages\*" `
            "runtime\Lib\site-packages" `
            -Recurse `
            -Force

      - name: Add face detector
        shell: powershell
        run: |
          New-Item `
            -ItemType Directory `
            -Force `
            -Path "runtime\models" | Out-Null

          Copy-Item `
            "models\haarcascade_frontalface_default.xml" `
            "runtime\models\haarcascade_frontalface_default.xml"

      - name: Add application files
        shell: powershell
        run: |
          Copy-Item `
            "main.py" `
            "runtime\main.py"

          Copy-Item `
            "swap.py" `
            "runtime\swap.py"

      - name: Verify runtime
        shell: powershell
        run: |
          if (!(Test-Path "runtime\python.exe")) {
              Write-Error "Python runtime missing."
              exit 1
          }

          if (!(Test-Path "runtime\python38.dll")) {
              Write-Error "Python DLL missing."
              exit 1
          }

          if (!(Test-Path "runtime\Lib\site-packages\numpy")) {
              Write-Error "NumPy missing."
              exit 1
          }

          if (!(Test-Path "runtime\Lib\site-packages\cv2")) {
              Write-Error "OpenCV missing."
              exit 1
          }

          if (!(Test-Path "runtime\Lib\site-packages\PIL")) {
              Write-Error "Pillow missing."
              exit 1
          }

          if (!(Test-Path "runtime\models\haarcascade_frontalface_default.xml")) {
              Write-Error "Haar Cascade missing."
              exit 1
          }

          Write-Host "Runtime verification successful."

      - name: Create runtime ZIP
        shell: powershell
        run: |
          Compress-Archive `
            -Path "runtime\*" `
            -DestinationPath "OfflineImageSwap-Runtime.zip" `
            -CompressionLevel Optimal `
            -Force

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: OfflineImageSwap-Runtime
          path: OfflineImageSwap-Runtime.zip
          if-no-files-found: error
